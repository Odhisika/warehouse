{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="breadcrumb">Settings › <span class="current">Security</span></div>
    <div class="page-title">Security</div>
    <p style="font-size:13px;color:var(--gray-500);margin-top:4px">Change your account password.</p>
  </div>
</div>

<form method="post" style="padding:16px 24px;max-width:480px">
  {% csrf_token %}
  <div class="card" style="padding:20px">
    <div style="font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Change Password
    </div>

    <div class="form-group">
      <label class="form-label">Current Password</label>
      <div class="pw-wrap">
        <input type="password" name="current_password" class="form-control" required autocomplete="current-password" id="pw-current">
        <button type="button" class="pw-toggle" onclick="togglePassword('pw-current', this)" tabindex="-1" aria-label="Toggle password visibility">
          <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">New Password</label>
      <div class="pw-wrap">
        <input type="password" name="new_password" class="form-control" required minlength="8" autocomplete="new-password" id="pw-new">
        <button type="button" class="pw-toggle" onclick="togglePassword('pw-new', this)" tabindex="-1" aria-label="Toggle password visibility">
          <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
        </button>
      </div>
      <div class="form-hint">Minimum 8 characters.</div>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <div class="pw-wrap">
        <input type="password" name="confirm_password" class="form-control" required autocomplete="new-password" id="pw-confirm">
        <button type="button" class="pw-toggle" onclick="togglePassword('pw-confirm', this)" tabindex="-1" aria-label="Toggle password visibility">
          <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      <button type="submit" class="btn btn-primary">Update Password</button>
    </div>
  </div>
</form>
{% endblock %}
