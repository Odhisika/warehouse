{% extends "base.html" %}
{% block content %}
<div style="padding:10px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gray-200);padding-bottom:12px;background:white">
  <div class="breadcrumb">Fleet / Vehicles / <span class="current">{% if vehicle %}Edit{% else %}New{% endif %}</span></div>
</div>
<form method="post" style="padding:16px 24px;max-width:720px">
  {% csrf_token %}
  <div class="card" style="padding:16px">
    <div class="card-header" style="padding-bottom:14px"><span class="card-title">{% if vehicle %}Edit Vehicle{% else %}New Vehicle{% endif %}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="form-group">
        <label class="form-label">Plate Number *</label>
        <input class="form-control" type="text" name="plate_number" value="{{ vehicle.plate_number|default:'' }}" required placeholder="e.g. GR-1234-24" style="text-transform:uppercase">
      </div>
      <div class="form-group">
        <label class="form-label">Vehicle Type</label>
        <select class="form-control" name="vehicle_type">
          {% for val, label in fleet_vehicle_types %}
          <option value="{{ val }}" {% if vehicle.vehicle_type == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">Make / Model</label>
      <input class="form-control" type="text" name="make_model" value="{{ vehicle.make_model|default:'' }}" placeholder="e.g. Toyota Hilux">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="form-group">
        <label class="form-label">Capacity Weight (kg)</label>
        <input class="form-control" type="number" step="0.01" name="capacity_weight_kg" value="{{ vehicle.capacity_weight_kg|default:'0' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Capacity Volume (m³)</label>
        <input class="form-control" type="number" step="0.01" name="capacity_volume_m3" value="{{ vehicle.capacity_volume_m3|default:'0' }}">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="form-group">
        <label class="form-label">Insurance Expiry</label>
        <input class="form-control" type="date" name="insurance_expiry" value="{{ vehicle.insurance_expiry|date:'Y-m-d'|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Last Service Date</label>
        <input class="form-control" type="date" name="last_service_date" value="{{ vehicle.last_service_date|date:'Y-m-d'|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Fitness Cert Expiry</label>
        <input class="form-control" type="date" name="fitness_cert_expiry" value="{{ vehicle.fitness_cert_expiry|date:'Y-m-d'|default:'' }}">
      </div>
    </div>
    {% if vehicle %}
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">Status</label>
      <select class="form-control" name="status">
        <option value="active" {% if vehicle.status == 'active' %}selected{% endif %}>Active</option>
        <option value="maintenance" {% if vehicle.status == 'maintenance' %}selected{% endif %}>Under Maintenance</option>
        <option value="retired" {% if vehicle.status == 'retired' %}selected{% endif %}>Retired</option>
      </select>
    </div>
    {% endif %}
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">Assigned Branch</label>
      <input class="form-control" type="text" name="assigned_branch" value="{{ vehicle.assigned_branch|default:'' }}" placeholder="e.g. ACCRA">
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label class="form-label">Notes</label>
      <textarea class="form-control" name="notes" rows="3">{{ vehicle.notes|default:'' }}</textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <a href="{% if vehicle %}{% url 'vehicle_detail' vehicle.pk %}{% else %}{% url 'vehicle_list' %}{% endif %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">{% if vehicle %}Save Changes{% else %}Add Vehicle{% endif %}</button>
    </div>
  </div>
</form>
{% endblock %}
