{% extends "base.html" %}
{% block content %}
<div style="padding:10px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gray-200);padding-bottom:12px;background:white">
  <div class="breadcrumb">Fleet / Drivers / <span class="current">{% if driver %}Edit{% else %}New{% endif %}</span></div>
</div>
<form method="post" style="padding:16px 24px;max-width:640px">
  {% csrf_token %}
  <div class="card" style="padding:16px">
    <div class="card-header" style="padding-bottom:14px"><span class="card-title">{% if driver %}Edit Driver{% else %}New Driver{% endif %}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="form-group">
        <label class="form-label">First Name *</label>
        <input class="form-control" type="text" name="first_name" value="{{ driver.first_name|default:'' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input class="form-control" type="text" name="last_name" value="{{ driver.last_name|default:'' }}">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="form-group">
        <label class="form-label">License Number *</label>
        <input class="form-control" type="text" name="license_number" value="{{ driver.license_number|default:'' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">License Expiry</label>
        <input class="form-control" type="date" name="license_expiry" value="{{ driver.license_expiry|date:'Y-m-d'|default:'' }}">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input class="form-control" type="text" name="phone" value="{{ driver.phone|default:'' }}" placeholder="+233-...">
      </div>
      <div class="form-group">
        <label class="form-label">Assigned Branch</label>
        <input class="form-control" type="text" name="assigned_branch" value="{{ driver.assigned_branch|default:'' }}" placeholder="e.g. ACCRA">
      </div>
    </div>
    {% if driver %}
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">Status</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="checkbox" name="is_active" id="is_active" {% if driver.is_active %}checked{% endif %}>
        <label for="is_active" style="font-size:13px;cursor:pointer">Active</label>
      </div>
    </div>
    {% endif %}
    <div class="form-group" style="margin-bottom:14px">
      <label class="form-label">Notes</label>
      <textarea class="form-control" name="notes" rows="3">{{ driver.notes|default:'' }}</textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <a href="{% if driver %}{% url 'driver_detail' driver.pk %}{% else %}{% url 'driver_list' %}{% endif %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">{% if driver %}Save Changes{% else %}Add Driver{% endif %}</button>
    </div>
  </div>
</form>
{% endblock %}
